<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Isian — Batas Kesempatan</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        h1 { color: #2c3e50; margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .soal-box {
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            max-width: 750px;
            width: 100%;
        }
        .teks-soal {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 500;
        }
        .info-baris {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .indikator { color: #7f8c8d; font-size: 0.95rem; }
        .kesempatan {
            font-weight: bold;
            font-size: 0.95rem;
        }
        .kesempatan.aman { color: #2ecc71; }
        .kesempatan.sedang { color: #f39c12; }
        .kesempatan.berbahaya { color: #e74c3c; }
        .kotak-besar {
            display: flex;
            border: 4px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
            width: 100%;
        }
        .kolom {
            flex: 1;
            border-right: 3px solid #2c3e50;
        }
        .kolom:last-child { border-right: none; }
        .input-kotak {
            width: 100%;
            height: 85px;
            border: none;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            outline: none;
            transition: background 0.2s;
        }
        .input-kotak:focus { background: #e3f2fd; }
        .input-kotak.benar { background: #d4edda; color: #155724; }
        .input-kotak.salah { background: #f8d7da; color: #721c24; }
        .input-kotak:disabled { cursor: not-allowed; background: #eee; }
        .tombol-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .tombol {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tombol:hover { transform: scale(1.05); }
        .tombol:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .tombol-kosongkan { background: #e74c3c; color: white; }
        .tombol-periksa { background: #3498db; color: white; }
        .tombol-lanjut { background: #2ecc71; color: white; }
        .nav-soal {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .pesan {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .pesan.benar { background: #d4edda; color: #155724; display: block; }
        .pesan.salah { background: #f8d7da; color: #721c24; display: block; }
        .muat-info {
            text-align: center;
            color: #7f8c8d;
            padding: 30px;
        }
    </style>
</head>
<body>
    <h1>📝 Kotak Isian — Batas Kesempatan</h1>
    <div class="soal-box" id="area-soal" style="display: none;">
        <div class="info-baris">
            <div class="indikator">Soal <span id="nomor-soal">1</span> dari <span id="jumlah-soal">0</span></div>
            <div class="kesempatan aman" id="info-kesempatan">Kesempatan: 3 kali</div>
        </div>
        
        <div class="teks-soal" id="teks-soal"></div>
        
        <div class="kotak-besar" id="wadah-kotak"></div>
        
        <div class="pesan" id="pesan"></div>
        
        <div class="tombol-group">
            <button class="tombol tombol-kosongkan" id="btn-kosongkan" onclick="kosongkanSalahSaja()">🔄 Ulangi Salah</button>
            <button class="tombol tombol-periksa" id="btn-periksa" onclick="periksaJawaban()">✅ Periksa</button>
            <button class="tombol tombol-lanjut" id="tombol-berikutnya" onclick="soalBerikutnya()" style="display: none;">➡️ Berikutnya</button>
        </div>
        
        <div class="nav-soal">
            <button class="tombol" id="tombol-sebelumnya" onclick="soalSebelumnya()" style="display: none;">⬅️ Sebelumnya</button>
            <div></div>
        </div>
    </div>
    
    <div class="muat-info" id="area-muat">
        <p>📥 Sedang memuat soal dari soal.csv...</p>
        <p style="margin-top: 15px; font-size: 0.9rem;">Pastikan format: soal,jawaban,keterangan</p>
    </div>

<script>
// Aturan kesempatan:
// Jumlah kesempatan = ceil(jumlah huruf / 2)
// 2 huruf → 1 kali, 4 → 2, 6 → 3, 8 → 4, dst.

let daftarSoal = [];
let nomor = 0;
let sudahPeriksa = false;
let sisaKesempatan = 0;
let maksKesempatan = 0;
let jawabanBenarSkrg = "";

async function ambilSoal() {
    try {
        const res = await fetch("soal.csv", { cache: "no-store" });
        if (!res.ok) throw new Error("Tidak dapat memuat soal.csv");
        const teks = await res.text();
        
        const baris = teks.split("\n").map(r => {
            const hasil = [];
            let bagian = "", dalamKutip = false;
            for (let c of r) {
                if (c === '"') { dalamKutip = !dalamKutip; }
                else if (c === "," && !dalamKutip) { 
                    hasil.push(bagian.trim()); 
                    bagian = ""; 
                }
                else { bagian += c; }
            }
            hasil.push(bagian.trim());
            return hasil;
        });
        
        daftarSoal = [];
        for (let i = 1; i < baris.length; i++) {
            const k = baris[i];
            if (!k || k.length < 2 || !k[0]) continue;
            daftarSoal.push({
                soal: k[0].replace(/^"|"$/g, ""),
                jawaban: (k[1] || "").replace(/^"|"$/g, "").replace(/\s+/g, "").toUpperCase().trim(),
                keterangan: k[2] ? k[2].replace(/^"|"$/g, "") : ""
            });
        }
    } catch (err) {
        daftarSoal = [
            { soal: "Gaya yang mendorong benda disebut...", jawaban: "DORONGAN", keterangan: "8 huruf — D-O-R-O-N-G-A-N" },
            { soal: "Satuan gaya adalah...", jawaban: "NEWTON", keterangan: "6 huruf — N-E-W-T-O-N" },
            { soal: "Benda yang ditarik akan...", jawaban: "BERGERAK", keterangan: "8 huruf — B-E-R-G-E-R-A-K" }
        ];
    }
    
    document.getElementById("area-muat").style.display = "none";
    document.getElementById("area-soal").style.display = "block";
    document.getElementById("jumlah-soal").textContent = daftarSoal.length;
    
    tampilSoal();
}

function tampilSoal() {
    sudahPeriksa = false;
    const soalSkrg = daftarSoal[nomor];
    jawabanBenarSkrg = soalSkrg.jawaban;
    
    // Hitung kesempatan otomatis
    const jumlahHuruf = jawabanBenarSkrg.length;
    maksKesempatan = Math.ceil(jumlahHuruf / 2);
    sisaKesempatan = maksKesempatan;
    
    // Tampil soal
    document.getElementById("nomor-soal").textContent = nomor + 1;
    document.getElementById("teks-soal").textContent = soalSkrg.soal;
    document.getElementById("pesan").style.display = "none";
    document.getElementById("tombol-berikutnya").style.display = "none";
    document.getElementById("tombol-sebelumnya").style.display = nomor > 0 ? "inline-block" : "none";
    perbaruiInfoKesempatan();
    
    // Buat kotak
    const wadah = document.getElementById("wadah-kotak");
    wadah.innerHTML = "";
    
    for (let i = 0; i < jumlahHuruf; i++) {
        const kolom = document.createElement("div");
        kolom.className = "kolom";
        
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input-kotak";
        input.maxLength = 1;
        input.autocomplete = "off";
        input.spellcheck = false;
        input.dataset.index = i;
        
        input.oninput = function() {
            if (this.value && i + 1 < jumlahHuruf) {
                document.querySelectorAll(".input-kotak")[i + 1].focus();
            }
        };
        
        kolom.appendChild(input);
        wadah.appendChild(kolom);
    }
    
    setTimeout(() => {
        const kotakPertama = document.querySelector(".input-kotak");
        if (kotakPertama) kotakPertama.focus();
    }, 50);
}

function perbaruiInfoKesempatan() {
    const el = document.getElementById("info-kesempatan");
    el.textContent = `Kesempatan: ${sisaKesempatan} kali`;
    el.className = "kesempatan";
    if (sisaKesempatan > maksKesempatan / 2) el.classList.add("aman");
    else if (sisaKesempatan > 1) el.classList.add("sedang");
    else el.classList.add("berbahaya");
}

function kosongkanSalahSaja() {
    // Kosongkan kotak yang belum benar, biarkan yang benar tetap
    document.querySelectorAll(".input-kotak").forEach(k => {
        if (!k.classList.contains("benar")) {
            k.value = "";
            k.classList.remove("salah");
            k.disabled = false;
        }
    });
    document.getElementById("pesan").style.display = "none";
    sudahPeriksa = false;
    document.querySelector(".input-kotak:not(.benar)").focus();
}

function periksaJawaban() {
    if (sudahPeriksa || sisaKesempatan <= 0) return;
    
    const semuaKotak = document.querySelectorAll(".input-kotak");
    let semuaBenar = true;
    let adaIsi = false;
    
    semuaKotak.forEach((k, i) => {
        if (k.value) adaIsi = true;
        const huruf = (k.value || "").toUpperCase();
        const benar = huruf === jawabanBenarSkrg[i];
        
        if (benar) {
            k.classList.add("benar");
            k.classList.remove("salah");
            k.disabled = true; // Kunci huruf yang sudah benar
        } else if (k.value) {
            k.classList.add("salah");
            k.classList.remove("benar");
            semuaBenar = false;
        } else {
            semuaBenar = false;
        }
    });
    
    if (!adaIsi) {
        alert("Isi dulu kotaknya!");
        return;
    }
    
    sudahPeriksa = true;
    
    if (semuaBenar) {
        const pesanEl = document.getElementById("pesan");
        pesanEl.textContent = "✅ BENAR! " + (daftarSoal[nomor].keterangan || "");
        pesanEl.className = "pesan benar";
        document.getElementById("btn-kosongkan").disabled = true;
        document.getElementById("btn-periksa").disabled = true;
        
        if (nomor < daftarSoal.length - 1) {
            document.getElementById("tombol-berikutnya").style.display = "inline-block";
        } else {
            pesanEl.textContent += " 🎉 Selesai semua!";
        }
        return;
    }
    
    // Kurangi kesempatan
    sisaKesempatan--;
    perbaruiInfoKesempatan();
    
    if (sisaKesempatan <= 0) {
        // Tampilkan jawaban benar
        semuaKotak.forEach((k, i) => {
            k.value = jawabanBenarSkrg[i];
            k.classList.add("benar");
            k.disabled = true;
        });
        const pesanEl = document.getElementById("pesan");
        pesanEl.textContent = "❌ Kesempatan habis! Jawaban: " + jawabanBenarSkrg;
        pesanEl.className = "pesan salah";
        document.getElementById("btn-kosongkan").disabled = true;
        document.getElementById("btn-periksa").disabled = true;
        
        if (nomor < daftarSoal.length - 1) {
            document.getElementById("tombol-berikutnya").style.display = "inline-block";
        }
    } else {
        // Masih ada kesempatan — bisa perbaiki
        const pesanEl = document.getElementById("pesan");
        pesanEl.textContent = `⚠️ Belum tepat! Sisa kesempatan: ${sisaKesempatan} kali`;
        pesanEl.className = "pesan salah";
        setTimeout(() => {
            sudahPeriksa = false;
            document.querySelector(".input-kotak.salah").focus();
        }, 500);
    }
}

function soalBerikutnya() {
    if (nomor < daftarSoal.length - 1) {
        nomor++;
        tampilSoal();
    }
}

function soalSebelumnya() {
    if (nomor > 0) {
        nomor--;
        tampilSoal();
    }
}

ambilSoal();
</script>
</body>
</html>
