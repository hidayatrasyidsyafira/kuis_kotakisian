<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kotak Isian — Soal dari Google Sheet</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }
        h1 { color: #2c3e50; margin-bottom: 20px; font-size: 1.5rem; text-align: center; }
        .soal-box {
            background: white;
            padding: 25px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            max-width: 650px;
            width: 100%;
        }
        .teks-soal {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 30px;
            line-height: 1.6;
            font-weight: 500;
        }
        .kotak-besar {
            display: flex;
            flex-wrap: wrap;
            border: 4px solid #2c3e50;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        .kolom {
            border-right: 3px solid #2c3e50;
        }
        .kolom:last-child { border-right: none; }
        .input-kotak {
            width: 65px;
            height: 85px;
            border: none;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #2c3e50;
            outline: none;
            transition: background 0.2s;
        }
        .input-kotak:focus { background: #e3f2fd; }
        .input-kotak.benar { background: #d4edda; color: #155724; }
        .input-kotak.salah { background: #f8d7da; color: #721c24; }
        .tombol-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
        }
        .tombol {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tombol:hover { transform: scale(1.05); }
        .tombol-kosongkan { background: #e74c3c; color: white; }
        .tombol-periksa { background: #3498db; color: white; }
        .tombol-lanjut { background: #2ecc71; color: white; }
        .nav-soal {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .indikator {
            text-align: center;
            color: #7f8c8d;
            margin-top: 15px;
            font-size: 0.95rem;
        }
        .pesan {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .pesan.benar { background: #d4edda; color: #155724; display: block; }
        .pesan.salah { background: #f8d7da; color: #721c24; display: block; }
        .muat-info {
            text-align: center;
            color: #7f8c8d;
            padding: 30px;
        }
    </style>
</head>
<body>
    <h1>📝 Kotak Isian</h1>
    <div class="soal-box" id="area-soal" style="display: none;">
        <div class="indikator">Soal <span id="nomor-soal">1</span> dari <span id="jumlah-soal">0</span></div>
        <div class="teks-soal" id="teks-soal"></div>
        
        <div class="kotak-besar" id="wadah-kotak"></div>
        
        <div class="pesan" id="pesan"></div>
        
        <div class="tombol-group">
            <button class="tombol tombol-kosongkan" onclick="kosongkanSemua()">🗑️ Kosongkan</button>
            <button class="tombol tombol-periksa" onclick="periksaJawaban()">✅ Periksa</button>
            <button class="tombol tombol-lanjut" id="tombol-berikutnya" onclick="soalBerikutnya()" style="display: none;">➡️ Berikutnya</button>
        </div>
        
        <div class="nav-soal">
            <button class="tombol" id="tombol-sebelumnya" onclick="soalSebelumnya()" style="display: none;">⬅️ Sebelumnya</button>
            <div></div>
        </div>
    </div>
    
    <div class="muat-info" id="area-muat">
        <p>📥 Sedang memuat soal dari Google Sheet...</p>
        <p style="margin-top: 15px; font-size: 0.9rem;">Jika tidak muncul, pastikan file soal.csv sudah dibuat dan dibagikan publik</p>
    </div>

<script>
// ==============================================================
// FORMAT soal.csv di Google Sheet / di GitHub:
// kolom A = soal, kolom B = jawaban (tanpa spasi), kolom C = keterangan
// Contoh:
// soal,jawaban,keterangan
// Prinsip kerja Stack adalah?,LIFO,Last In First Out
// Operasi menambah data ke Stack disebut?,PUSH,Menambah ke bagian atas
// ==============================================================

let daftarSoal = [];
let nomor = 0;
let sudahPeriksa = false;

async function ambilSoal() {
    try {
        // Coba ambil dari soal.csv (GitHub atau hosting)
        const res = await fetch("soal.csv", { cache: "no-store" });
        if (!res.ok) throw new Error("Tidak dapat memuat soal.csv");
        const teks = await res.text();
        
        // Parse CSV
        const baris = teks.split("\n").map(r => {
            const hasil = [];
            let bagian = "", dalamKutip = false;
            for (let c of r) {
                if (c === '"') dalamKutip = !dalamKutip;
                else if (c === "," && !dalamKutip) { hasil.push(bagian.trim()); bagian = ""; }
                else bagian += c;
            }
            hasil.push(bagian.trim());
            return hasil;
        });
        
        daftarSoal = [];
        for (let i = 1; i < baris.length; i++) {
            const k = baris[i];
            if (!k || k.length < 2 || !k[0]) continue;
            daftarSoal.push({
                soal: k[0].replace(/^"|"$/g, ""),
                jawaban: (k[1] || "").replace(/^"|"$/g, "").toUpperCase().trim(),
                keterangan: k[2] ? k[2].replace(/^"|"$/g, "") : ""
            });
        }
    } catch (err) {
        // Soal contoh jika belum ada soal.csv
        daftarSoal = [
            { soal: "Prinsip kerja Stack adalah...", jawaban: "LIFO", keterangan: "Last In First Out" },
            { soal: "Operasi menambah data ke Stack disebut...", jawaban: "PUSH", keterangan: "Menambah ke bagian atas" },
            { soal: "Operasi mengambil data dari Stack disebut...", jawaban: "POP", keterangan: "Mengambil dari bagian atas" }
        ];
    }
    
    document.getElementById("area-muat").style.display = "none";
    document.getElementById("area-soal").style.display = "block";
    document.getElementById("jumlah-soal").textContent = daftarSoal.length;
    
    tampilSoal();
}

function tampilSoal() {
    sudahPeriksa = false;
    const soalSkrg = daftarSoal[nomor];
    
    // Teks soal
    document.getElementById("nomor-soal").textContent = nomor + 1;
    document.getElementById("teks-soal").textContent = soalSkrg.soal;
    document.getElementById("pesan").style.display = "none";
    document.getElementById("tombol-berikutnya").style.display = "none";
    
    // Navigasi
    document.getElementById("tombol-sebelumnya").style.display = nomor > 0 ? "inline-block" : "none";
    
    // Buat kotak sesuai panjang jawaban
    const wadah = document.getElementById("wadah-kotak");
    wadah.innerHTML = "";
    const panjang = soalSkrg.jawaban.length;
    
    for (let i = 0; i < panjang; i++) {
        const kolom = document.createElement("div");
        kolom.className = "kolom";
        
        const input = document.createElement("input");
        input.type = "text";
        input.className = "input-kotak";
        input.maxLength = 1;
        input.dataset.index = i;
        input.oninput = function() { pindahFokus(this, i + 1); };
        
        kolom.appendChild(input);
        wadah.appendChild(kolom);
    }
    
    // Fokus kotak pertama
    setTimeout(() => {
        const kotakPertama = document.querySelector(".input-kotak");
        if (kotakPertama) kotakPertama.focus();
    }, 50);
}

function pindahFokus(elemen, posisiBerikutnya) {
    if (elemen.value && posisiBerikutnya < daftarSoal[nomor].jawaban.length) {
        const semuaKotak = document.querySelectorAll(".input-kotak");
        if (semuaKotak[posisiBerikutnya]) semuaKotak[posisiBerikutnya].focus();
    }
}

function kosongkanSemua() {
    document.querySelectorAll(".input-kotak").forEach(k => {
        k.value = "";
        k.classList.remove("benar", "salah");
    });
    document.getElementById("pesan").style.display = "none";
    document.getElementById("tombol-berikutnya").style.display = "none";
    sudahPeriksa = false;
    document.querySelector(".input-kotak").focus();
}

function periksaJawaban() {
    if (sudahPeriksa) return;
    
    const jawabanBenar = daftarSoal[nomor].jawaban;
    let dijawab = "";
    const semuaKotak = document.querySelectorAll(".input-kotak");
    
    semuaKotak.forEach((k, i) => {
        const huruf = (k.value || "").toUpperCase();
        dijawab += huruf;
        
        if (huruf === jawabanBenar[i]) {
            k.classList.add("benar");
            k.classList.remove("salah");
        } else {
            k.classList.add("salah");
            k.classList.remove("benar");
        }
    });
    
    const pesanEl = document.getElementById("pesan");
    sudahPeriksa = true;
    
    if (dijawab === jawabanBenar) {
        pesanEl.textContent = "✅ BENAR! " + (daftarSoal[nomor].keterangan || "");
        pesanEl.className = "pesan benar";
    } else {
        pesanEl.textContent = "❌ Belum tepat. Jawaban: " + jawabanBenar + ". " + (daftarSoal[nomor].keterangan || "");
        pesanEl.className = "pesan salah";
    }
    
    if (nomor < daftarSoal.length - 1) {
        document.getElementById("tombol-berikutnya").style.display = "inline-block";
    } else {
        pesanEl.textContent += " 🎉 Selesai semua!";
    }
}

function soalBerikutnya() {
    if (nomor < daftarSoal.length - 1) {
        nomor++;
        tampilSoal();
    }
}

function soalSebelumnya() {
    if (nomor > 0) {
        nomor--;
        tampilSoal();
    }
}

// Mulai
ambilSoal();
</script>
</body>
</html>
